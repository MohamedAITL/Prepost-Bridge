<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Prepost fills in your posts on Meta, X, YouTube and TikTok in your own browser, and leaves publishing to you." />
    <meta name="theme-color" content="#1e6b57" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Prepost</title>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('prepost.theme') || 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
